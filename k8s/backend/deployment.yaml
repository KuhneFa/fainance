apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fainance
  labels:
    app: backend
spec:
  replicas: 1                  # 1 Replica — SQLite PVC ReadWriteOnce
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: fainance-backend:latest
          imagePullPolicy: Never       # immer lokales Image nutzen
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: backend-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-pvc
  namespace: fainance
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi