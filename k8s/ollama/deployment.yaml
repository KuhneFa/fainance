apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: fainance
  labels:
    app: ollama
spec:
  replicas: 1                # LLM nicht sinnvoll horizontal skalierbar
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate           # Kein Rolling Update — PVC ReadWriteOnce
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        # Init-Container lädt das Modell beim ersten Start.
        # Läuft durch bevor der Hauptcontainer startet.
        - name: ollama-model-pull
          image: ollama/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              sleep 3
              ollama pull llama3.2:3b
              echo "Modell geladen."
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"  # LLM braucht RAM
            limits:
              cpu: "2000m"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 10  # Modell-Laden braucht Zeit
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc