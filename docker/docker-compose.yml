services:

  # ── Ollama ────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Ollama startet automatisch den Server beim Container-Start.
    # Das Modell wird beim ersten Request geladen — oder via ollama-init.

  # ── Ollama Model Initializer ──────────────────────────────────────────────────
  # Einmaliger Container der das Modell in Ollama lädt.
  # Läuft durch und beendet sich — das ist gewollt (restart: no).
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        echo 'Warte auf Ollama...' &&
        sleep 5 &&
        ollama pull llama3.2:3b &&
        echo 'Modell geladen.'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - finance_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  finance_data:
  ollama_models: